
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماشین حساب نئونی من</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="calculator">
        <header class="calc-header">
            <span class="logo">✦</span>
            <div>
                <h1>ماشین حساب</h1>
                <p>NEON CALCULATOR</p>
            </div>
        </header>

        <input
            type="text"
            id="display"
            value="عدد"
            readonly
            aria-label="صفحه نمایش ماشین حساب"
        >

        <div class="buttons">
            <button class="pink" type="button">C</button>
            <button class="operator" type="button">÷</button>
            <button class="operator" type="button">×</button>
            <button class="pink" type="button">⌫</button>

            <button type="button">7</button>
            <button type="button">8</button>
            <button type="button">9</button>
            <button class="operator" type="button">-</button>

            <button type="button">4</button>
            <button type="button">5</button>
            <button type="button">6</button>
            <button class="operator" type="button">+</button>

            <button type="button">1</button>
            <button type="button">2</button>
            <button type="button">3</button>
            <button class="equals" type="button">=</button>

            <button class="zero" type="button">0</button>
            <button type="button">.</button>
        </div>

        <footer>Development By Ali Asgharian =) ✨</footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
